<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoção LondriGás</title>

  <meta property="og:title" content="Promoção LondriGás">
  <meta property="og:description" content="Peça seu gás com desconto especial pelo WhatsApp!">
  <meta property="og:image" content="https://julioolimpio1988jc-pixel.github.io/promocao-londrigas/poster-da-promocao.jpeg">
  <meta property="og:url" content="https://julioolimpio1988jc-pixel.github.io/promocao-londrigas/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; text-align: center; font-family: Arial, sans-serif; }
    .poster { position: relative; display: inline-block; max-width: 100%; }
    .poster img { display: block; max-width: 100%; height: auto; }
    .whatsapp {
      position: absolute;
      top: 82%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      border-radius: 16px;
      background: #16e662;
      color: white;
      font-size: clamp(16px, 4vw, 32px);
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
  </style>
</head>
<body>
  <main class="poster">
    <img src="poster-da-promocao.jpeg" alt="Poster da promoção LondriGás">
    <a
      class="whatsapp"
      href="https://api.whatsapp.com/send/?phone=554333371300&text=Ola%2C%20gostaria%20de%20mais%20informacoes%20sobre%20a%20promocao.&type=phone_number&app_absent=0"
      target="_blank"
      rel="noopener noreferrer"
    >📲 Peça pelo WhatsApp</a>
  </main>
</body>
</html>
